<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EngineeringTeam workflow hero</title>
  <desc id="desc">A repo-first agent workflow that maps the repo, traces contracts, routes specialists, gates implementation, verifies changes, and hands off reviewable artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="58" r="110" fill="#1d4ed8" opacity="0.28"/>
  <circle cx="140" cy="300" r="120" fill="#7c3aed" opacity="0.22"/>

  <text x="600" y="70" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">EngineeringTeam</text>
  <text x="600" y="108" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#cbd5e1">Make your AI coding agent map, route, gate, verify, and hand off like a senior engineering team.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#60a5fa"/>
    <text x="133" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">USER</text>
    <text x="133" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Request</text>

    <rect x="258" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#818cf8"/>
    <text x="327" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc">MAP</text>
    <text x="327" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Repo Atlas</text>

    <rect x="452" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#c084fc"/>
    <text x="521" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">TRACE</text>
    <text x="521" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Contracts</text>

    <rect x="646" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#fb923c"/>
    <text x="715" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#fdba74">ROUTE</text>
    <text x="715" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Specialists</text>

    <rect x="840" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#4ade80"/>
    <text x="909" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#86efac">GATE</text>
    <text x="909" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Evidence</text>

    <rect x="1034" y="165" width="138" height="86" rx="18" fill="#111827" stroke="#38bdf8"/>
    <text x="1103" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">PROVE</text>
    <text x="1103" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Handoff</text>
  </g>

  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 202 208 H 248"/>
    <path d="M 396 208 H 442"/>
    <path d="M 590 208 H 636"/>
    <path d="M 784 208 H 830"/>
    <path d="M 978 208 H 1024"/>
  </g>

  <path d="M 716 253 C 716 305 910 305 910 253" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="813" y="314" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fed7aa">specialists only when risk demands them</text>

  <text x="600" y="342" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1">Repo-first • Evidence-gated • Multi-harness • No runtime service • No session-start hooks</text>
</svg>
