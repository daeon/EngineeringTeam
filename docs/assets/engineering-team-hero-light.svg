<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EngineeringTeam workflow hero</title>
  <desc id="desc">A repo-first expert-panel workflow that picks the right software engineering specialists, builds shared understanding, gates implementation, verifies changes, and hands off reviewable artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="58" r="110" fill="#dbeafe" opacity="0.55"/>
  <circle cx="140" cy="300" r="120" fill="#ede9fe" opacity="0.65"/>

  <text x="600" y="70" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a">EngineeringTeam</text>
  <text x="600" y="108" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Give your AI coding agent the right expert panel for every software engineering task.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="133" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">USER</text>
    <text x="133" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Request</text>

    <rect x="258" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="327" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3730a3">LEAD</text>
    <text x="327" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Intake</text>

    <rect x="452" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="521" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6d28d9">PANEL</text>
    <text x="521" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Experts</text>

    <rect x="646" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text x="715" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">MAP</text>
    <text x="715" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Repo & Risk</text>

    <rect x="840" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="909" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">GATE</text>
    <text x="909" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Evidence</text>

    <rect x="1034" y="165" width="138" height="86" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <text x="1103" y="199" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">PROVE</text>
    <text x="1103" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Patch/Handoff</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 202 208 H 248"/>
    <path d="M 396 208 H 442"/>
    <path d="M 590 208 H 636"/>
    <path d="M 784 208 H 830"/>
    <path d="M 978 208 H 1024"/>
  </g>

  <path d="M 716 253 C 716 305 910 305 910 253" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="813" y="314" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">smallest expert panel that covers the risk</text>

  <text x="600" y="342" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Expert-routed • Repo-first • Evidence-gated • Multi-harness • No runtime service</text>
</svg>
